# Oficjalny katalog akcji:
# https://github.com/marketplace?type=actions


name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U goals_user -d goals_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Create.env for CI
        run: |
          cat > ".env" << 'ENDENV'
          ENV=ci
          APP_VERSION=0.0.0.ci
          LOG_LEVEL=INFO
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
          DATABASE_URL=postgresql+psycopg://goals_user:goals_pass@localhost:5432/goals_db
          ENDENV
          echo "Using .env:"
          cat .env

      - name: Setup Python 3.12 & cache pip
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'poetry'
          cache-dependency-path: "poetry.lock"

      - name: Ensure poetry is on PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies (Poetry)
        run: |
          command -v poetry || which poetry
          poetry --version
          poetry install --no-interaction --no-ansi --with dev

      - name: Make lint, type, test (fmt as well)
        run: make ready-to-commit



